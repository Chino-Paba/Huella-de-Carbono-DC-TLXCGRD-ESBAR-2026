<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Huella de Carbono - Defensa Civil</title>
    
    <!-- Tailwind CSS (Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para compilar JSX en el navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js (Gráficos) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // Estados basados en el Sistema Internacional (SI)
            const [electricidad, setElectricidad] = useState(240);
            const [gas, setGas] = useState(18);
            const [vehiculo, setVehiculo] = useState(8500);
            const [vuelos, setVuelos] = useState(6);
            
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Cálculos de emisión (Aproximaciones estándar en t CO2e)
            const huellaHogar = ((electricidad * 1.5) + (gas * 24)) / 1000;
            const huellaTransporte = (vehiculo * 0.19) / 1000;
            const huellaVuelos = (vuelos * 90) / 1000;
            const huellaAlimentacion = 1.2; 
            
            const total = (huellaHogar + huellaTransporte + huellaVuelos + huellaAlimentacion).toFixed(1);

            // Renderizado del gráfico circular
            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Hogar', 'Transporte', 'Vuelos', 'Alimentación y Residuos'],
                        datasets: [{
                            data: [huellaHogar, huellaTransporte, huellaVuelos, huellaAlimentacion],
                            backgroundColor: ['#f97316', '#1e40af', '#38bdf8', '#22c55e'],
                            borderWidth: 0
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }, [electricidad, gas, vehiculo, vuelos]);

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Cabecera */}
                    <header className="bg-slate-900 text-white p-4 flex items-center justify-between border-b-4 border-orange-500">
                        <div className="flex items-center gap-4">
                            <img src="./Log BG.png" alt="Defensa Civil Colombiana" className="w-16 h-16 object-contain" />
                            <div>
                                <h1 className="text-xl font-bold text-orange-500">DEFENSA CIVIL COLOMBIANA</h1>
                                <p className="text-sm font-medium tracking-wide">LISTOS EN PAZ O EMERGENCIA</p>
                            </div>
                        </div>
                        <div className="text-right hidden md:block">
                            <h2 className="text-lg font-bold">CALCULADORA DE HUELLA DE CARBONO PERSONAL</h2>
                            <p className="text-sm text-gray-400">TLXCGRD ESBAR 2026</p>
                        </div>
                    </header>
                    
                    {/* Contenido Principal */}
                    <main className="flex-grow p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-7xl mx-auto w-full">
                        
                        {/* Panel de Controles */}
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 border-b pb-2">Hogar (Mensual)</h3>
                                
                                <div className="mb-6">
                                    <div className="flex justify-between mb-1">
                                        <label className="text-sm font-medium text-gray-700">Electricidad</label>
                                        <span className="text-sm font-bold text-orange-600">{electricidad} kWh</span>
                                    </div>
                                    <input type="range" min="0" max="1000" value={electricidad} onChange={(e) => setElectricidad(e.target.value)} className="w-full accent-orange-500" />
                                </div>
                                
                                <div>
                                    <div className="flex justify-between mb-1">
                                        <label className="text-sm font-medium text-gray-700">Gas natural</label>
                                        <span className="text-sm font-bold text-orange-600">{gas} m³</span>
                                    </div>
                                    <input type="range" min="0" max="100" value={gas} onChange={(e) => setGas(e.target.value)} className="w-full accent-orange-500" />
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 border-b pb-2">Transporte (Anual)</h3>
                                
                                <div className="mb-6">
                                    <div className="flex justify-between mb-1">
                                        <label className="text-sm font-medium text-gray-700">Vehículo particular</label>
                                        <span className="text-sm font-bold text-blue-600">{vehiculo} km</span>
                                    </div>
                                    <input type="range" min="0" max="20000" step="100" value={vehiculo} onChange={(e) => setVehiculo(e.target.value)} className="w-full accent-blue-600" />
                                </div>
                                
                                <div>
                                    <div className="flex justify-between mb-1">
                                        <label className="text-sm font-medium text-gray-700">Vuelos de avión</label>
                                        <span className="text-sm font-bold text-blue-600">{vuelos} horas</span>
                                    </div>
                                    <input type="range" min="0" max="50" value={vuelos} onChange={(e) => setVuelos(e.target.value)} className="w-full accent-blue-600" />
                                </div>
                            </div>
                        </div>

                        {/* Panel de Resultados */}
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center justify-center h-48">
                                <h3 className="font-bold text-xl text-slate-800 mb-2">Tu Huella Total:</h3>
                                <div className="text-7xl font-black text-slate-800 tracking-tighter">{total}</div>
                                <div className="text-lg text-gray-500 font-medium mt-2">t CO₂e / año</div>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 text-center">Distribución de Emisiones</h3>
                                <div className="h-64 w-full relative">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Pie de Página */}
                    <footer className="bg-slate-900 text-white text-center p-3 text-sm border-t-4 border-green-600 font-medium mt-auto">
                        TLXCGRD ESBAR 2026 - DEFENSA CIVIL COLOMBIANA - COMPROMETIDOS CON LA GESTIÓN DEL RIESGO Y EL MEDIO AMBIENTE
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
