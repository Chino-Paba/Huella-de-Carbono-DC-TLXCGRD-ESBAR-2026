<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Huella de Carbono - Defensa Civil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        Chart.register(ChartDataLabels);

        function App() {
            const [elec, setElec] = useState({ value: 240, per: 'Mensual' });
            const [gas, setGas] = useState({ value: 18, per: 'Mensual' });
            const [personas, setPersonas] = useState(3);
            
            const [coche, setCoche] = useState({ value: 8500, per: 'Anual' });
            const [moto, setMoto] = useState({ value: 0, per: 'Anual' });
            const [bus, setBus] = useState({ value: 240, per: 'Mensual' });
            const [vuelos, setVuelos] = useState({ value: 6, per: 'Anual' });
            
            const [dieta, setDieta] = useState('Moderada');
            const [basura, setBasura] = useState({ value: 12, per: 'Semanal' });
            const [recicla, setRecicla] = useState(true);
            const [composta, setComposta] = useState(false);

            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const getMulti = (per) => {
                if(per === 'Diario') return 365;
                if(per === 'Semanal') return 52;
                if(per === 'Mensual') return 12;
                if(per === 'Anual') return 1;
                return 1;
            };

            const getSliderMax = (per, baseM) => {
                if(per === 'Diario') return Math.max(1, Math.round(baseM / 30));
                if(per === 'Semanal') return Math.max(1, Math.round(baseM / 4));
                if(per === 'Mensual') return baseM;
                if(per === 'Anual') return baseM * 12;
                return baseM;
            };

            const huellaHogar = (((elec.value * getMulti(elec.per) * 0.38) + (gas.value * getMulti(gas.per) * 2.02)) / 1000) / Math.max(1, personas);
            const huellaTransporte = ((coche.value * getMulti(coche.per) * 0.19) + (moto.value * getMulti(moto.per) * 0.09) + (bus.value * getMulti(bus.per) * 0.05) + (vuelos.value * getMulti(vuelos.per) * 90)) / 1000;
            
            let hAlim = 2.5;
            if(dieta === 'Carnívora') hAlim = 3.3;
            if(dieta === 'Vegetariana') hAlim = 1.5;
            if(dieta === 'Vegana') hAlim = 1.0;

            let hResiduos = (basura.value * getMulti(basura.per) * 1.5) / 1000;
            if(recicla) hResiduos *= 0.7;
            if(composta) hResiduos *= 0.8;

            const total = (huellaHogar + huellaTransporte + hAlim + hResiduos).toFixed(1);
            const arboles = Math.round((total * 1000) / 22);

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Hogar', 'Transporte', 'Alimentación', 'Residuos'],
                        datasets: [{
                            data: [huellaHogar, huellaTransporte, hAlim, hResiduos],
                            backgroundColor: ['#f97316', '#1e40af', '#22c55e', '#eab308'],
                            borderWidth: 0
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        plugins: { 
                            legend: { position: 'bottom' },
                            datalabels: {
                                color: '#ffffff',
                                font: { weight: 'bold', size: 14 },
                                formatter: (value, context) => {
                                    const sum = context.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                                    if (sum === 0 || value === 0) return null;
                                    const percentage = (value * 100 / sum).toFixed(1);
                                    // Ocultar etiquetas muy pequeñas para evitar que se superpongan en el diseño
                                    return percentage < 4 ? null : percentage + '%';
                                }
                            }
                        } 
                    }
                });
            }, [huellaHogar, huellaTransporte, hAlim, hResiduos]);

            const periodOptions = ['Diario', 'Semanal', 'Mensual', 'Anual'];

            const renderInputGroup = (label, icon, state, setState, baseMax, unit) => (
                <div className="mb-5">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-2 gap-2">
                        <label className="text-sm font-medium text-gray-700 flex items-center gap-2">
                            <i className={`fa-solid ${icon} text-gray-500 w-4`}></i> {label}
                        </label>
                        <div className="flex items-center gap-2">
                            <input type="number" min="0" value={state.value} onChange={e => setState({...state, value: Number(e.target.value)})} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-orange-500" />
                            <span className="text-sm text-gray-500 font-medium w-8">{unit}</span>
                            <select value={state.per} onChange={e => setState({...state, per: e.target.value})} className="border border-gray-300 rounded px-2 py-1 text-sm bg-white focus:outline-none focus:ring-1 focus:ring-orange-500">
                                {periodOptions.map(p => <option key={p} value={p}>{p}</option>)}
                            </select>
                        </div>
                    </div>
                    <input type="range" min="0" max={getSliderMax(state.per, baseMax)} value={state.value} onChange={e => setState({...state, value: Number(e.target.value)})} className="w-full accent-orange-500" />
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <header className="bg-slate-900 text-white p-4 flex flex-col md:flex-row items-center justify-between border-b-4 border-orange-500 gap-4">
                        <div className="flex items-center gap-4">
                            <img src="./Log BG.png" alt="Defensa Civil Colombiana" className="w-16 h-16 object-contain" />
                            <div>
                                <h1 className="text-xl font-bold text-orange-500">DEFENSA CIVIL COLOMBIANA</h1>
                                <p className="text-sm font-medium tracking-wide">LISTOS EN PAZ O EMERGENCIA</p>
                            </div>
                        </div>
                        <div className="text-center md:text-right">
                            <h2 className="text-lg font-bold">CALCULADORA DE HUELLA DE CARBONO</h2>
                            <p className="text-sm text-gray-400">TLXCGRD ESBAR 2026</p>
                        </div>
                    </header>
                    
                    <main className="flex-grow p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-7xl mx-auto w-full">
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-house text-orange-500"></i> Hogar</h3>
                                {renderInputGroup('Electricidad', 'fa-bolt', elec, setElec, 500, 'kWh')}
                                {renderInputGroup('Gas natural', 'fa-fire', gas, setGas, 50, 'm³')}
                                <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center pt-2">
                                    <label className="text-sm font-medium text-gray-700 flex items-center gap-2"><i className="fa-solid fa-users text-gray-500 w-4"></i> Personas en el hogar</label>
                                    <input type="number" min="1" value={personas} onChange={e => setPersonas(Math.max(1, Number(e.target.value)))} className="w-20 border border-gray-300 rounded px-2 py-1 text-sm mt-2 sm:mt-0" />
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-car text-blue-600"></i> Transporte</h3>
                                {renderInputGroup('Vehículo particular', 'fa-car-side', coche, setCoche, 1000, 'km')}
                                {renderInputGroup('Motocicleta', 'fa-motorcycle', moto, setMoto, 800, 'km')}
                                {renderInputGroup('Transporte público', 'fa-bus', bus, setBus, 500, 'km')}
                                {renderInputGroup('Vuelos de avión', 'fa-plane', vuelos, setVuelos, 5, 'hrs')}
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 border-b pb-2 flex items-center gap-2"><i className="fa-solid fa-utensils text-green-600"></i> Alimentación y Residuos</h3>
                                <div className="mb-5">
                                    <label className="text-sm font-medium text-gray-700 flex items-center gap-2 mb-2"><i className="fa-solid fa-carrot text-gray-500 w-4"></i> Tipo de dieta (Impacto anual base)</label>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                        {['Carnívora', 'Moderada', 'Vegetariana', 'Vegana'].map(d => (
                                            <button key={d} onClick={() => setDieta(d)} className={`px-2 py-1 text-sm rounded border ${dieta === d ? 'bg-green-500 text-white border-green-500' : 'bg-gray-50 text-gray-700 border-gray-300 hover:bg-gray-100'}`}>{d}</button>
                                        ))}
                                    </div>
                                </div>
                                {renderInputGroup('Generación de basura', 'fa-trash-can', basura, setBasura, 50, 'kg')}
                                <div className="flex gap-4 pt-2">
                                    <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                        <input type="checkbox" checked={recicla} onChange={e => setRecicla(e.target.checked)} className="rounded text-green-500 focus:ring-green-500" />
                                        <i className="fa-solid fa-recycle text-green-600"></i> Reciclo
                                    </label>
                                    <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
                                        <input type="checkbox" checked={composta} onChange={e => setComposta(e.target.checked)} className="rounded text-green-500 focus:ring-green-500" />
                                        <i className="fa-solid fa-leaf text-green-600"></i> Composto
                                    </label>
                                </div>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100 flex flex-col items-center justify-center">
                                <h3 className="font-bold text-xl text-slate-800 mb-2 flex items-center gap-2"><i className="fa-solid fa-earth-americas text-blue-500"></i> Tu Huella Total:</h3>
                                <div className="text-6xl font-black text-slate-800 tracking-tighter my-4">{total}</div>
                                <div className="text-lg text-gray-500 font-medium">t CO₂e / año</div>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border border-green-200 bg-green-50 flex flex-col items-center justify-center">
                                <h3 className="font-bold text-lg mb-2 text-green-800 flex items-center gap-2"><i className="fa-solid fa-tree text-green-600 text-xl"></i> Compensación Ecológica</h3>
                                <div className="text-5xl font-black text-green-600 my-3">{arboles}</div>
                                <div className="text-sm text-green-700 font-medium text-center">árboles nativos a sembrar para neutralizar tus emisiones este año</div>
                                <p className="text-xs text-green-700 mt-2 text-center opacity-80">*Basado en una capacidad de absorción de 22 kg de CO₂ por árbol al año.</p>
                            </div>

                            <div className="bg-white p-6 rounded-xl shadow border border-gray-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800 text-center">Distribución de Emisiones</h3>
                                <div className="h-48 w-full relative">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="bg-slate-900 text-white text-center p-3 text-sm border-t-4 border-green-600 font-medium mt-auto">
                        TLXCGRD ESBAR 2026 - DEFENSA CIVIL COLOMBIANA - COMPROMETIDOS CON LA GESTIÓN DEL RIESGO Y EL MEDIO AMBIENTE
                    </footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
